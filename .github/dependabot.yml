version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Los saltos de version mayor (Spring Boot, OpenPDF, ...) se planifican a mano
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      menores-y-parches:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

spring.application.name=parqueadero
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/parqueadero}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=ParqueaderoHikariPool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# El esquema lo gestiona Flyway (db/migration); Hibernate solo lo valida
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

spring.flyway.enabled=${FLYWAY_ENABLED:true}
# Bases ya existentes (creadas antes con ddl-auto=update): se marcan en la version 1 y se aplican solo las siguientes
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger deshabilitado por defecto; habilitar solo en desarrollo con SWAGGER_ENABLED=true
# La autenticacion es por JWT: no hace falta el usuario en memoria generado por Spring
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}

# Origenes permitidos por CORS, separados por coma (admite patrones como https://*.vercel.app)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4000,https://*.vercel.app}

# Limite de tamano del cuerpo de /api/v1/sync (bytes)
app.sync.max-payload-bytes=${APP_SYNC_MAX_PAYLOAD_BYTES:10485760}

app.jwt.secret=${APP_JWT_SECRET}
# Access token corto (15 min); el refresh token renueva la sesion
app.jwt.expiration-millis=${APP_JWT_EXPIRATION_MILLIS:900000}
app.jwt.refresh-expiration-millis.super-admin=${APP_JWT_REFRESH_EXPIRATION_SUPER_ADMIN:604800000}
app.jwt.refresh-expiration-millis.admin=${APP_JWT_REFRESH_EXPIRATION_ADMIN:604800000}
app.jwt.refresh-expiration-millis.operario=${APP_JWT_REFRESH_EXPIRATION_OPERARIO:28800000}

logging.level.saas.parqueadero=${APP_LOG_LEVEL:INFO}

# Dias de anticipacion con que el banner avisa de mensualidades proximas a vencer
app.mensualidad.alerta.dias-anticipacion=${APP_MENSUALIDAD_ALERTA_DIAS:5}

# Cancelacion automatica de mensualidades vencidas
app.mensualidad.cancelacion.cron=${APP_MENSUALIDAD_CANCELACION_CRON:0 5 0 * * *}

# Licencias anuales (firma HMAC de los codigos de activacion)
# Obligatorio (Base64, minimo 32 bytes). Sin valor por defecto: la app no arranca sin el.
app.license.hmac-secret=${LICENSE_HMAC_SECRET:}

# Sincronizacion con las instalaciones de escritorio
app.sync.base-url=${APP_SYNC_BASE_URL:}
app.sync.retencion-dias=${APP_SYNC_RETENCION_DIAS:90}
app.sync.intervalo-sugerido-segundos=${APP_SYNC_INTERVALO_SEGUNDOS:600}
app.sync.limpieza-cron=${APP_SYNC_LIMPIEZA_CRON:0 30 3 * * *}